<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz-App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #D0D1EB;;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header-container {
            width: 100%;
            height: 10vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            background: #D0D1EB;
            padding: 0 2vw;
        }
        .register-btn {
            width: 11vw;
            height: 5vh;
            border-radius: 12px;
            /* background: #463BD5; */
            background: black;
            color: #FEF9F9;
            font-size: 1.5vw;
            font-family: Inter;
            font-weight: 400;
            text-align: center;
            line-height: 5vh;
            text-decoration: none;
            display: inline-block;
            border: none;
            cursor: pointer;
        }
        .illustration-section {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .illustration-img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
            max-height: 80vh;
        }
        .form-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .form-control {
            height: 50px;
            border-radius: 12px;
            background: #F7F7F7;
            /*                              border: none; */
        }
        .btn-login {
            height: 50px;
            border-radius: 12px;
            /* background: #463BD5/=; */
            /* background: #463BD5/=; */
            background: black;  
            color: white;
            font-weight: 700;
        }
        .social-btn {
            width: 9.5vw;
            height: 6vh;
            border-radius: 120px;
        }
        @media (max-width: 991px) {
            .illustration-section {
                display: none;
            }
            .form-section {
                min-height: auto;
                padding: 2rem 1rem;
                margin-top: 10vh;
            }
            .register-btn {
                width: auto;
                padding: 0 1.5rem;
                font-size: 1rem;
                height: 40px;
                line-height: 40px;
            }
            .social-btn {
                width: 120px;
                height: 50px;
            }
            .form-control {
                height: 45px;
            }
            .btn-login {
                height: 45px;
            }
        }
        @media (max-width: 576px) {
            .header-container {
                padding: 0 1rem;
            }
            .form-section {
                padding: 1rem;
            }
            .social-btn {
                width: 100px;
                height: 45px;
            }
            .form-control {
                height: 40px;
            }
            .btn-login {
                height: 40px;
            }
        }
        @media (min-width: 992px) {
            .form-section {
                max-width: 450px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <!-- Header with logo and register button -->
        <header class="header-container d-flex justify-content-between align-items-center">
            <img style="width: 9vw; height: 15vh; border-radius: 12px" src="quizlogo.jpgpng" alt="Logo" />
             <!-- <h1>WELCOME STUDENT'S</h1> -->
            <nav>
                <a href="register.html" class="register-btn">Register</a>
            </nav>
        </header>

        <div class="row g-0">
            <!-- Right side image -->
            <div class="col-lg-6 illustration-section">
                <img src="newfrontimage-removebg-preview.png" alt="Illustration" class="illustration-img">
            </div>

            <!-- Login form section -->
            <div class="col-lg-6 form-section">
                <div class="w-100" style="max-width: 450px;">
                    <form>
                        <div class="mb-3">
                            <label for="email" class="form-label" style="color: #141212; font-family: Inter;">Email Address</label>
                            <input id="email" name="email" type="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label" style="color: #141212; font-family: Inter;">Password</label>
                            <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password">
                        </div>

                        <a href="#" class="d-block text-end mb-3" style="color: #141212; font-family: Inter;">Forgot Password?</a>

                        <button type="submit" class="btn btn-login w-100 mb-4">
                            Login
                        </button>

                        <!-- Divider with "or" -->
                        <div class="position-relative mb-4 text-center">
                            <hr class="d-inline-block" style="width: 40%; border: 1px solid #A6A6A6; vertical-align: middle;">
                            <span class="mx-2" style="color: #A6A6A6; font-size: 16px; vertical-align: middle;">or</span>
                            <hr class="d-inline-block" style="width: 40%; border: 1px solid #A6A6A6; vertical-align: middle;">
                        </div>

                        <!-- Social buttons -->
                        <div class="d-flex gap-3 justify-content-center">
                            <button class="btn btn-outline-danger social-btn">
                                <i class="fab fa-google" style="color: #D53B3B; font-size: 1.5vw;"></i>
                            </button>
                            <button class="btn btn-outline-primary social-btn">
                                <i class="fab fa-facebook" style="color: #463BD5; font-size: 1.5vw;"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
