<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password - Quiz-App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #D0D1EB;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .password-form {
            background: #D0D1EB;
            padding: 2rem;
        }
        .form-control {
            height: 50px;
            border-radius: 12px;
            background: #F7F7F7;
            border: none;
        }
        .btn-reset {
            height: 50px;
            border-radius: 12px;
            background: #282626;
            color: white;
            font-weight: 700;
        }
        .form-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        @media (max-width: 576px) {
            .form-section {
                min-height: auto;
                padding: 2rem 0;
            }
            .password-form {
                margin: 0 1rem;
            }
        }
        @media (min-width: 577px) {
            .password-form {
                max-width: 450px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0 justify-content-center">
            <!-- Form section -->
            <div class="col-12 col-md-8 col-lg-6 form-section">
                <div class="password-form w-100">
                    <h1 class="text-center mb-5" style="color: #060606; font-size: 2rem; font-family: Inter; font-weight: 400;">
                        Create New Password
                    </h1>
                    
                    <form>
                        <div class="mb-4">
                            <input type="password" id="new-password" class="form-control" placeholder="Enter new password">
                        </div>

                        <div class="mb-5">
                            <input type="password" id="confirm-password" class="form-control" placeholder="Confirm new password">
                        </div>

                        <button type="submit" class="btn btn-reset w-100 mb-4">
                            Reset Password
                        </button>

                        
                    </form>   
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
