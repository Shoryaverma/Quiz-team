<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Quiz-App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color:#D0D1EB;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .illustration-section {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .illustration-img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
            max-height: 80vh;
        }
        .form-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .form-control {
            height: 50px;
            border-radius: 12px;
            background: #F7F7F7;
            border: none;
        }
        .btn-send {
            height: 50px;
            border-radius: 12px;
            background: #282626;
            color: white;
            font-weight: 700;
        }
        .back-link {
            color: #6F6A6A;
            text-decoration: none;
            font-weight: 700;
            font-size: 17px;
        }
        .back-link:hover {
            color: #463BD5;
        }

        @media (max-width: 991px) {
            .illustration-section {
                display: none;
            }
            .form-section {
                min-height: auto;
                padding: 2rem 1rem;
            }
            .form-control {
                height: 45px;
            }
            .btn-send {
                height: 45px;
            }
        }
        @media (max-width: 576px) {
            .form-section {
                padding: 1rem;
            }
            .form-control {
                height: 40px;
            }
            .btn-send {
                height: 40px;
            }
        }
        @media (min-width: 992px) {
            .form-section {
                max-width: 450px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Left side image -->
            <div class="col-lg-6 illustration-section">
                <img src="password.webp" alt="Illustration" class="illustration-img">
            </div>

            <!-- Forgot Password form section -->
            <div class="col-lg-6 form-section">
                <div class="w-100" style="max-width: 450px;">
                    <h2 class="mb-4" style="color: #060606; font-family: Inter; font-weight: 400;">Forgot Password</h2>
                    
                    <form>
                        <div class="mb-4">
                            <input id="email" name="email" type="email" class="form-control" placeholder="Enter Email Address">
                        </div>

                        <button type="submit" class="btn btn-send w-100 mb-4">
                            Send
                        </button>

                        <a href="main.html" class="back-link d-block text-center">
                            Back to sign in
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
